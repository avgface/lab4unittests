name: Geometry Unit Tests CI/CD

on:
  push:
    branches: [ main, master, lab4-unit-tests, lab5-ci-cd ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Run unit tests
    run: |
      python -m unittest circle.py square.py rectangle.py triangle.py -v